name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.0.0, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          QUANTITY_PACKAGE_ARTIFACT: ${{ runner.temp }}/quantity-package.tgz
      - name: Build documentation and demo from verified output
        if: matrix.node-version == '24.x'
        run: npm run site:built
      - name: Retain verified package
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: verified-package
          path: ${{ runner.temp }}/quantity-package.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Retain documentation and demo
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: docs
          if-no-files-found: error
          retention-days: 7
